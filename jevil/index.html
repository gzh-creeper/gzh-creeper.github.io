<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jevil 混沌炸弹</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; font-family: 'Courier New', monospace; overflow: hidden;
    }
    canvas {
      display: block; border: 3px solid #6a3d9a;
      box-shadow: 0 0 30px #6a3d9a88, 0 0 60px #6a3d9a44;
      image-rendering: pixelated;
    }
    #ui {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      color: #ffd700; font-size: 18px; letter-spacing: 2px;
      text-shadow: 0 0 10px #ffd70088; pointer-events: none; z-index: 10;
    }
    #hp-bar {
      position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
      width: 260px; height: 18px; background: #222; border: 2px solid #6a3d9a;
      border-radius: 4px; overflow: hidden; z-index: 10;
    }
    #hp-fill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #ffd700, #ff6b6b); transition: width 0.15s;
    }
    #hp-text {
      position: fixed; top: 66px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 12px; letter-spacing: 1px; z-index: 10;
    }
    #gameover {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #ffd700; font-size: 32px; text-align: center; letter-spacing: 4px;
      text-shadow: 0 0 20px #ffd700, 0 0 40px #ff6b6b; display: none;
      z-index: 20; pointer-events: none;
    }
    #gameover small { display: block; font-size: 16px; margin-top: 12px; color: #aaa; letter-spacing: 2px; }
    #start-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0a0fee; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 30;
      color: #ffd700; text-align: center; cursor: pointer;
    }
    #start-screen h1 { font-size: 36px; letter-spacing: 6px; text-shadow: 0 0 20px #6a3d9a; margin-bottom: 8px; }
    #start-screen .sub { font-size: 14px; color: #9b59b6; letter-spacing: 3px; margin-bottom: 30px; }
    #start-screen .hint { font-size: 13px; color: #888; letter-spacing: 2px; line-height: 2; }
    #start-screen .hint span { color: #ffd700; }
    #start-screen .blink { animation: blink 1s infinite; margin-top: 24px; font-size: 16px; color: #ff6b6b; letter-spacing: 3px; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="ui">CHAOS BOMB</div>
  <div id="hp-bar"><div id="hp-fill"></div></div>
  <div id="hp-text">HP 100 / 100</div>
  <div id="gameover">GAME OVER<small>按 R 重新开始</small></div>
  <div id="start-screen">
    <h1>JEVIL</h1>
    <div class="sub">混 沌 炸 弹</div>
    <div class="hint">
      <span>方向键 / WASD</span> 移动灵魂<br>
      躲避所有花色炸弹，存活下来
    </div>
    <div class="blink">按任意键开始</div>
  </div>
  <canvas id="game"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ================================================================
  // ⚠️ 配置区：贴图文件路径
  // 请确保使用本地服务器运行（Live Server 或 python -m http.server）
  // ================================================================
  
  // 灵魂贴图
  const SOUL_FILE = 'assets/soul.png';

  // 炸弹黑底贴图
  const BOMB_BLACK_FILES = {
    club:    'assets/1.png',
    diamond: 'assets/2.png',
    heart:   'assets/3.png',
    spade:   'assets/4.png'
  };

  // 炸弹白底贴图
  const BOMB_WHITE_FILES = {
    club:    'assets/5.png',
    diamond: 'assets/6.png',
    heart:   'assets/7.png',
    spade:   'assets/8.png'
  };

  // 子弹贴图
  const BULLET_FILES = {
    heart:   'assets/9.png',
    spade:   'assets/10.png',
    club:    'assets/11.png',
    diamond: 'assets/12.png'
  };

  // ---------- 动态去除紫色背景 ----------
  function removePurpleBackground(img) {
    if (!img || !img.complete || img.naturalWidth === 0) return img;
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    try {
      const imageData = cx.getImageData(0, 0, c.width, c.height);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if (r > 150 && g < 100 && b > 150) data[i + 3] = 0;
      }
      cx.putImageData(imageData, 0, 0);
      return c;
    } catch (e) {
      console.warn('【去紫边失败】请使用 Live Server 或本地服务器运行！', e);
      return img;
    }
  }

  // ---------- 加载所有贴图 ----------
  const bulletImages = {};
  const bombBlackImages = {};
  const bombWhiteImages = {};
  let soulImage = null;

  function loadAssets(callback) {
    let total = Object.keys(BULLET_FILES).length 
              + Object.keys(BOMB_BLACK_FILES).length 
              + Object.keys(BOMB_WHITE_FILES).length 
              + 1; // +1 为 soul.png
    let loaded = 0;
    const checkDone = () => {
      loaded++;
      if (loaded === total && callback) callback();
    };

    // 加载灵魂
    const soulImg = new Image();
    soulImg.onload = () => { soulImage = removePurpleBackground(soulImg); checkDone(); };
    soulImg.onerror = () => { console.warn(`无法加载灵魂贴图: ${SOUL_FILE}`); checkDone(); };
    soulImg.src = SOUL_FILE;

    // 加载子弹
    Object.keys(BULLET_FILES).forEach(suit => {
      const img = new Image();
      img.onload = () => { bulletImages[suit] = removePurpleBackground(img); checkDone(); };
      img.onerror = () => { console.warn(`无法加载子弹贴图: ${BULLET_FILES[suit]}`); checkDone(); };
      img.src = BULLET_FILES[suit];
    });

    // 加载炸弹黑底
    Object.keys(BOMB_BLACK_FILES).forEach(suit => {
      const img = new Image();
      img.onload = () => { bombBlackImages[suit] = removePurpleBackground(img); checkDone(); };
      img.onerror = () => { console.warn(`无法加载炸弹黑底贴图: ${BOMB_BLACK_FILES[suit]}`); checkDone(); };
      img.src = BOMB_BLACK_FILES[suit];
    });

    // 加载炸弹白底
    Object.keys(BOMB_WHITE_FILES).forEach(suit => {
      const img = new Image();
      img.onload = () => { bombWhiteImages[suit] = removePurpleBackground(img); checkDone(); };
      img.onerror = () => { console.warn(`无法加载炸弹白底贴图: ${BOMB_WHITE_FILES[suit]}`); checkDone(); };
      img.src = BOMB_WHITE_FILES[suit];
    });
  }

  loadAssets(() => console.log('所有贴图加载完毕'));

  // ---------- 游戏参数 ----------
  const CW = 520, CH = 520;
  canvas.width = CW; canvas.height = CH;
  const PAD = 60;
  const BX = PAD, BY = PAD, BW = CW - PAD * 2, BH = CH - PAD * 2;

  let state = 'start';
  let hp = 100, maxHp = 100;
  let invincible = 0;
  let time = 0, gameTime = 0, score = 0;

  const soul = { x: CW / 2, y: CH / 2, r: 8, speed: 4.5 };
  const keys = {};

  let bombs = [];
  let bullets = [];
  let particles = [];

  let bombTimer = 0;
  let bombInterval = 90;
  let difficulty = 1;

  const SUITS = ['heart', 'spade', 'club', 'diamond'];
  const SUIT_COLORS = { heart: '#ff4466', spade: '#9b59b6', club: '#44cc88', diamond: '#44aaff' };
  const SUIT_SYMBOLS = { heart: '♥', spade: '♠', club: '♣', diamond: '♦' };

  // ---------- 输入 ----------
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (state === 'start') { startGame(); return; }
    if (state === 'gameover' && e.key.toLowerCase() === 'r') { startGame(); }
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // ---------- 游戏控制 ----------
  function startGame() {
    state = 'playing';
    hp = maxHp = 100;
    invincible = 0; time = 0; gameTime = 0; score = 0; difficulty = 1;
    soul.x = CW / 2; soul.y = CH / 2;
    bombs = []; bullets = []; particles = [];
    bombTimer = 0; bombInterval = 90;
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('gameover').style.display = 'none';
    updateHpUI();
  }

  function updateHpUI() {
    document.getElementById('hp-fill').style.width = (hp / maxHp * 100) + '%';
    document.getElementById('hp-text').textContent = `HP ${Math.max(0, Math.floor(hp))} / ${maxHp}`;
  }

  function spawnBomb() {
    const suit = SUITS[Math.floor(Math.random() * SUITS.length)];
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    const margin = 30;
    switch (edge) {
      case 0: x = BX + Math.random() * BW; y = BY - margin; break;
      case 1: x = BX + BW + margin; y = BY + Math.random() * BH; break;
      case 2: x = BX + Math.random() * BW; y = BY + BH + margin; break;
      case 3: x = BX - margin; y = BY + Math.random() * BH; break;
    }
    const tx = BX + 40 + Math.random() * (BW - 80);
    const ty = BY + 40 + Math.random() * (BH - 80);
    bombs.push({ x, y, tx, ty, suit, speed: 2.2 + Math.random() * 1.0, exploded: false, explodeTimer: 0, scale: 1.0 });
  }

  function explodeBomb(bomb) {
    const { suit, tx, ty } = bomb;
    if (suit === 'heart') {
      const count = 4;
      const baseAngle = Math.random() * Math.PI * 2;
      for (let i = 0; i < count; i++) {
        const a = baseAngle + (i / count) * Math.PI * 2;
        bullets.push({
          x: tx, y: ty, vx: 0, vy: 0, suit: 'heart', r: 7, rotation: 0, type: 'heart', life: 340,
          centerX: tx, centerY: ty, phase: 'expand', expandRadius: 0, maxRadius: 50, expandSpeed: 1.6,
          orbitAngle: a, orbitSpeed: 0.055, travelAngle: 0, travelSpeed: 2.4
        });
      }
    } else if (suit === 'spade') {
      const count = 8;
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2;
        bullets.push({
          x: tx + Math.cos(a) * 12, y: ty + Math.sin(a) * 12,
          vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2,
          suit: 'spade', r: 8, rotation: a, type: 'spade', life: 200
        });
      }
    } else if (suit === 'club') {
      const baseAngle = Math.atan2(soul.y - ty, soul.x - tx);
      const count = 3;
      for (let i = 0; i < count; i++) {
        const a = baseAngle + (i - 1) * 0.45;
        bullets.push({
          x: tx, y: ty, vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5,
          suit: 'club', r: 7, rotation: a, type: 'club', life: 220
        });
      }
    } else {
      const baseAngle = Math.atan2(soul.y - ty, soul.x - tx);
      const speeds = [3.2, 2.6, 2.0];
      for (let i = 0; i < speeds.length; i++) {
        bullets.push({
          x: tx, y: ty, vx: Math.cos(baseAngle) * speeds[i], vy: Math.sin(baseAngle) * speeds[i],
          suit: 'diamond', r: 6, rotation: baseAngle, type: 'diamond', life: 240
        });
      }
    }

    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 4;
      particles.push({ x: tx, y: ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 25 + Math.random() * 20, maxLife: 45, color: SUIT_COLORS[suit], r: 2 + Math.random() * 3 });
    }
  }

  function update() {
    if (state !== 'playing') return;
    time++; gameTime++;
    difficulty = 1 + gameTime / 1800;
    bombInterval = Math.max(35, 90 - Math.floor(gameTime / 40) * 4);

    const sp = soul.speed;
    if (keys['arrowleft'] || keys['a']) soul.x -= sp;
    if (keys['arrowright'] || keys['d']) soul.x += sp;
    if (keys['arrowup'] || keys['w']) soul.y -= sp;
    if (keys['arrowdown'] || keys['s']) soul.y += sp;
    soul.x = Math.max(BX + soul.r, Math.min(BX + BW - soul.r, soul.x));
    soul.y = Math.max(BY + soul.r, Math.min(BY + BH - soul.r, soul.y));

    if (invincible > 0) invincible--;
    bombTimer++;
    if (bombTimer >= bombInterval) {
      bombTimer = 0; spawnBomb();
      if (difficulty > 1.6 && Math.random() < 0.5) setTimeout(() => { if (state === 'playing') spawnBomb(); }, 200);
    }

    // 更新炸弹
    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i];
      if (!b.exploded) {
        const dx = b.tx - b.x, dy = b.ty - b.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 5) { b.x = b.tx; b.y = b.ty; b.exploded = true; b.explodeTimer = 0; }
        else { const move = Math.min(b.speed, dist); b.x += (dx / dist) * move; b.y += (dy / dist) * move; }
      } else {
        b.explodeTimer++;
        if (b.explodeTimer === 1) explodeBomb(b);
        b.scale = 1 + b.explodeTimer * 0.06;
        if (b.explodeTimer > 14) bombs.splice(i, 1);
      }
    }

    // 更新子弹
    for (let i = bullets.length - 1; i >= 0; i--) {
      const bu = bullets[i];
      if (bu.type === 'heart') {
        if (bu.phase === 'expand') {
          bu.expandRadius += bu.expandSpeed;
          const reached = bu.expandRadius >= bu.maxRadius;
          if (reached) bu.expandRadius = bu.maxRadius;
          bu.x = bu.centerX + Math.cos(bu.orbitAngle) * bu.expandRadius;
          bu.y = bu.centerY + Math.sin(bu.orbitAngle) * bu.expandRadius;
          if (reached) {
            bu.travelAngle = Math.atan2(soul.y - bu.centerY, soul.x - bu.centerX);
            bu.phase = 'orbit';
          }
        } else if (bu.phase === 'orbit') {
          bu.centerX += Math.cos(bu.travelAngle) * bu.travelSpeed;
          bu.centerY += Math.sin(bu.travelAngle) * bu.travelSpeed;
          bu.orbitAngle += bu.orbitSpeed;
          bu.x = bu.centerX + Math.cos(bu.orbitAngle) * bu.maxRadius;
          bu.y = bu.centerY + Math.sin(bu.orbitAngle) * bu.maxRadius;
        }
      } else {
        bu.x += bu.vx; bu.y += bu.vy;
        bu.rotation = Math.atan2(bu.vy, bu.vx);
      }

      bu.life--;
      if (bu.life <= 0 || bu.x < -80 || bu.x > CW + 80 || bu.y < -80 || bu.y > CH + 80) {
        bullets.splice(i, 1); continue;
      }

      if (invincible <= 0) {
        const dx = bu.x - soul.x, dy = bu.y - soul.y;
        const dist = Math.hypot(dx, dy);
        if (dist < bu.r + soul.r - 2) {
          takeDamage(bu.type === 'heart' ? 8 : 7);
          bullets.splice(i, 1);
        }
      }
    }

    // 更新粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    score = Math.floor(gameTime / 10);
    if (gameTime % 1800 === 0 && hp < maxHp) { hp = Math.min(maxHp, hp + 5); updateHpUI(); }
  }

  function takeDamage(dmg) {
    if (invincible > 0) return;
    hp -= dmg; invincible = 50; updateHpUI();
    canvas.style.transform = 'translate(3px, -2px)';
    setTimeout(() => { canvas.style.transform = ''; }, 60);
    setTimeout(() => {
      canvas.style.transform = 'translate(-3px, 2px)';
      setTimeout(() => { canvas.style.transform = ''; }, 60);
    }, 70);
    if (hp <= 0) { hp = 0; state = 'gameover'; document.getElementById('gameover').style.display = 'block'; }
  }

  function draw() {
    ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#111118';
    ctx.fillRect(0, 0, CW, BY); ctx.fillRect(0, BY + BH, CW, CH - BY - BH);
    ctx.fillRect(0, BY, BX, BH); ctx.fillRect(BX + BW, BY, CW - BX - BW, BH);

    ctx.strokeStyle = '#6a3d9a'; ctx.lineWidth = 3; ctx.strokeRect(BX, BY, BW, BH);
    ctx.strokeStyle = '#9b59b644'; ctx.lineWidth = 8; ctx.strokeRect(BX, BY, BW, BH);
    ctx.strokeStyle = '#6a3d9a18'; ctx.lineWidth = 1;
    for (let i = BX + 40; i < BX + BW; i += 40) { ctx.beginPath(); ctx.moveTo(i, BY); ctx.lineTo(i, BY + BH); ctx.stroke(); }
    for (let j = BY + 40; j < BY + BH; j += 40) { ctx.beginPath(); ctx.moveTo(BX, j); ctx.lineTo(BX + BW, j); ctx.stroke(); }

    // 粒子
    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 黑白闪烁状态
    const isWhitePhase = Math.floor(time / 30) % 2 === 0;
    const currentBombImages = isWhitePhase ? bombWhiteImages : bombBlackImages;

    // 炸弹
    for (const b of bombs) {
      ctx.save(); ctx.translate(b.x, b.y);
      const s = b.exploded ? b.scale : 1; ctx.scale(s, s);
      
      if (!b.exploded) {
        const img = currentBombImages[b.suit];
        if (img) {
          const dw = 32, dh = 32;
          ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
        } else {
          // 贴图未加载时的备用绘制
          ctx.fillStyle = '#1a1a2e'; ctx.strokeStyle = SUIT_COLORS[b.suit]; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = SUIT_COLORS[b.suit]; ctx.font = 'bold 16px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(SUIT_SYMBOLS[b.suit], 0, 1);
        }
      } else {
        const alpha = Math.max(0, 1 - b.explodeTimer / 14);
        ctx.globalAlpha = alpha * 0.7;
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 45);
        grad.addColorStop(0, SUIT_COLORS[b.suit]); grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    // 绘制子弹
    for (const bu of bullets) {
      ctx.save();
      ctx.translate(bu.x, bu.y);
      if (bu.type !== 'heart') ctx.rotate(bu.rotation);

      const col = SUIT_COLORS[bu.suit];
      ctx.shadowColor = col; ctx.shadowBlur = 10;

      const img = bulletImages[bu.suit];
      if (img) {
        const dw = bu.r * 3.5;
        const dh = bu.r * 3.5;
        ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
      } else {
        ctx.fillStyle = col; ctx.font = `bold ${bu.r * 2}px serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(SUIT_SYMBOLS[bu.suit], 0, 1);
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // ---------- 绘制灵魂（使用 soul.png） ----------
    if (state === 'playing' || state === 'start') {
      // 无敌帧闪烁逻辑（保留）
      const alpha = invincible > 0 && Math.floor(invincible / 4) % 2 === 0 ? 0.3 : 1;
      ctx.globalAlpha = alpha;

      ctx.save();
      ctx.translate(soul.x, soul.y);

      if (soulImage) {
        // 使用 soul.png 贴图
        const dw = soul.r * 3.2; // 可根据实际贴图比例微调
        const dh = soul.r * 3.2;
        ctx.drawImage(soulImage, -dw / 2, -dh / 2, dw, dh);
      } else {
        // 贴图未加载完成时，回退到原手绘红心
        ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff3355';
        ctx.beginPath(); const s = soul.r;
        ctx.moveTo(0, s * 0.4);
        ctx.bezierCurveTo(-s * 1.4, -s * 0.6, -s * 0.5, -s * 1.4, 0, -s * 0.5);
        ctx.bezierCurveTo(s * 0.5, -s * 1.4, s * 1.4, -s * 0.6, 0, s * 0.4);
        ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = '#ff8899'; ctx.beginPath(); ctx.arc(-2, -3, 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // UI 文字
    ctx.fillStyle = '#ffd700'; ctx.font = '14px "Courier New", monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(`SCORE ${score}`, BX + 4, BY + 4);
    ctx.fillText(`WAVE ${Math.floor(gameTime / 600) + 1}`, BX + 4, BY + 22);
    if (state === 'gameover') { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, CW, CH); }
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();

  document.getElementById('start-screen').addEventListener('click', startGame);
  document.getElementById('start-screen').addEventListener('touchstart', e => { e.preventDefault(); startGame(); }, { passive: false });
  window.addEventListener('blur', () => { Object.keys(keys).forEach(k => keys[k] = false); });
})();
</script>
</body>
</html>
