<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jevil - 纯梅花回合</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; font-family: 'Courier New', monospace; overflow: hidden;
    }
    canvas {
      display: block; border: 3px solid #6a3d9a;
      box-shadow: 0 0 30px #6a3d9a88, 0 0 60px #6a3d9a44;
      image-rendering: pixelated;
    }
    #ui {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      color: #ffd700; font-size: 18px; letter-spacing: 2px;
      text-shadow: 0 0 10px #ffd70088; pointer-events: none; z-index: 10;
    }
    #hp-bar {
      position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
      width: 260px; height: 18px; background: #222; border: 2px solid #6a3d9a;
      border-radius: 4px; overflow: hidden; z-index: 10;
    }
    #hp-fill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #ffd700, #ff6b6b); transition: width 0.15s;
    }
    #hp-text {
      position: fixed; top: 66px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 12px; letter-spacing: 1px; z-index: 10;
    }
    #gameover {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #ffd700; font-size: 32px; text-align: center; letter-spacing: 4px;
      text-shadow: 0 0 20px #ffd700, 0 0 40px #ff6b6b; display: none;
      z-index: 20; pointer-events: none;
    }
    #gameover small { display: block; font-size: 16px; margin-top: 12px; color: #aaa; letter-spacing: 2px; }
    #start-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0a0fee; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 30;
      color: #ffd700; text-align: center; cursor: pointer;
    }
    #start-screen h1 { font-size: 36px; letter-spacing: 6px; text-shadow: 0 0 20px #6a3d9a; margin-bottom: 8px; }
    #start-screen .sub { font-size: 14px; color: #9b59b6; letter-spacing: 3px; margin-bottom: 30px; }
    #start-screen .hint { font-size: 13px; color: #888; letter-spacing: 2px; line-height: 2; }
    #start-screen .hint span { color: #ffd700; }
    #start-screen .blink { animation: blink 1s infinite; margin-top: 24px; font-size: 16px; color: #ff6b6b; letter-spacing: 3px; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="ui">PURE CLUB TURN</div>
  <div id="hp-bar"><div id="hp-fill"></div></div>
  <div id="hp-text">HP 100 / 100</div>
  <div id="gameover">GAME OVER<small>按 R 重新开始</small></div>
  <div id="start-screen">
    <h1>JEVIL</h1>
    <div class="sub">纯 梅 花 回 合</div>
    <div class="hint">
      <span>方向键 / WASD</span> 移动灵魂<br>
      躲避所有梅花炸弹与弹幕<br>
      <span>F 键</span> 回满血量
    </div>
    <div class="blink">按任意键开始</div>
  </div>
  <canvas id="game"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ================================================================
  // ⚠️ 贴图配置区
  // ================================================================
  const SOUL_FILE = 'assets/soul.png';
  const BOMB_FILE = 'assets/1.png';
  const BULLET_FILE = 'assets/3.png';

  // ---------- 参数 ----------
  const PETAL_DISTANCE = 14;
  const BOMB_BASE_ORIENTATION = 0;

  const PETAL_ANGLE_SIDE = Math.PI * 45 / 180;
  const PETAL_ANGLE_MID  = Math.PI * 25 / 180;

  const BULLET_TURN_SPEED = 0.007;
  const BULLET_SPEED = 2.2;
  const BULLET_VISUAL_SCALE = 2.0;

  // ⭐ 子弹碰撞判定半径（调大）
  const BULLET_HITBOX_RADIUS = 12;

  // ⭐ 各层概率
  const PROB_CENTER = 1.00;
  const PROB_SIDE   = 0.80;
  const PROB_MID    = 0.50;
  const PROB_EDGE   = 0.90;

  const MAX_BULLETS_PER_ROUND = 9;

  // ---------- 动态去除紫色背景 ----------
  function removePurpleBackground(img) {
    if (!img || !img.complete || img.naturalWidth === 0) return img;
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    try {
      const imageData = cx.getImageData(0, 0, c.width, c.height);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if (r > 150 && g < 100 && b > 150) data[i + 3] = 0;
      }
      cx.putImageData(imageData, 0, 0);
      return c;
    } catch (e) {
      console.warn('【去紫边失败】请使用 Live Server 或本地服务器运行！', e);
      return img;
    }
  }

  // ---------- 加载贴图 ----------
  let soulImg = null;
  let bombImg = null;
  let bulletImg = null;

  function loadImage(src, callback) {
    const img = new Image();
    img.onload = () => { callback(removePurpleBackground(img)); };
    img.onerror = () => { console.warn(`无法加载贴图: ${src}`); callback(null); };
    img.src = src;
  }

  loadImage(SOUL_FILE, (img) => { soulImg = img; });
  loadImage(BOMB_FILE, (img) => { bombImg = img; });
  loadImage(BULLET_FILE, (img) => { bulletImg = img; });

  // ---------- 游戏参数 ----------
  const CW = 520, CH = 520;
  canvas.width = CW; canvas.height = CH;
  
  const PAD = 85;
  const BX = PAD, BY = PAD, BW = CW - PAD * 2, BH = CH - PAD * 2;

  const CENTER_X = BX + BW / 2;
  const CENTER_Y = BY + BH / 2;

  const BATTLE_CORNERS = [
    { x: BX, y: BY },
    { x: BX + BW, y: BY },
    { x: BX, y: BY + BH },
    { x: BX + BW, y: BY + BH }
  ];

  const FIRE_INTERVAL_FRAMES = 30;
  const TOTAL_FIRE_ROUNDS = 4;

  let state = 'start';
  let hp = 100, maxHp = 100;
  let invincible = 0;
  let time = 0, gameTime = 0, score = 0;

  const soul = { x: CW / 2, y: CH / 2, r: 8, speed: 4.5 };
  const keys = {};

  let bombs = [];
  let bullets = [];
  let particles = [];

  let spawnTimer = 0;
  let spawnInterval = 60;
  let difficulty = 1;

  // ---------- 输入 ----------
  window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    keys[key] = true;

    if (state === 'start') { startGame(); return; }
    if (state === 'gameover' && key === 'r') { startGame(); return; }

    if (state === 'playing' && key === 'f') {
      hp = maxHp;
      updateHpUI();
      canvas.style.boxShadow = '0 0 30px #44ff88, 0 0 60px #44ff88aa';
      setTimeout(() => { canvas.style.boxShadow = ''; }, 200);
      return;
    }

    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(key)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // ---------- 游戏控制 ----------
  function startGame() {
    state = 'playing';
    hp = maxHp = 100;
    invincible = 0; time = 0; gameTime = 0; score = 0; difficulty = 1;
    soul.x = CW / 2; soul.y = CH / 2;
    bombs = []; bullets = []; particles = [];
    spawnTimer = 0; spawnInterval = 60;
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('gameover').style.display = 'none';
    updateHpUI();
  }

  function updateHpUI() {
    document.getElementById('hp-fill').style.width = (hp / maxHp * 100) + '%';
    document.getElementById('hp-text').textContent = `HP ${Math.max(0, Math.floor(hp))} / ${maxHp}`;
  }

  // ---------- 生成炸弹 ----------
  function spawnBomb() {
    const canvasCorners = [
      { sx: -30, sy: -30, cornerIndex: 0 },
      { sx: CW + 30, sy: -30, cornerIndex: 1 },
      { sx: -30, sy: CH + 30, cornerIndex: 2 },
      { sx: CW + 30, sy: CH + 30, cornerIndex: 3 }
    ];
    const c = canvasCorners[Math.floor(Math.random() * 4)];
    const target = BATTLE_CORNERS[c.cornerIndex];

    const moveAngle = Math.atan2(target.y - c.sy, target.x - c.sx);

    bombs.push({
      x: c.sx, y: c.sy,
      startX: c.sx, startY: c.sy,
      targetX: target.x, targetY: target.y,
      progress: 0,
      speed: 0.015,
      currentRotation: moveAngle,
      state: 'moving',
      alpha: 1,
      fireTimer: 0,
      fireRoundsLeft: TOTAL_FIRE_ROUNDS,
      r: 16
    });
  }

  // ---------- 通用：创建子弹（使用更大的判定半径） ----------
  function createBullet(x, y, baseAngle, targetOffset, speed) {
    return {
      x: x, y: y,
      baseAngle: baseAngle,
      currentAngle: baseAngle,
      targetOffset: targetOffset,
      speed: speed,
      r: BULLET_HITBOX_RADIUS,   // ⭐ 判定半径变大
      life: 400,
      maxLife: 400
    };
  }

  // ---------- 发射粒子 ----------
  function spawnFireParticles(x, y, angle) {
    for (let k = 0; k < 4; k++) {
      const a = angle + (Math.random() - 0.5) * 0.6;
      const sp = 1 + Math.random() * 2.5;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 15 + Math.random() * 10, maxLife: 25,
        color: '#44cc88', r: 2 + Math.random() * 2
      });
    }
  }

  // ---------- 炸弹发射一轮 ----------
  function fireOneRound(bomb) {
    const rotationDelta = bomb.currentRotation - BOMB_BASE_ORIENTATION;
    const queue = [];

    // 1️⃣ 中间 3 个（朝战斗框中心）：100%
    if (Math.random() < PROB_CENTER) {
      const angleToCenter = Math.atan2(CENTER_Y - bomb.y, CENTER_X - bomb.x);
      for (let k = -1; k <= 1; k++) {
        queue.push({ angle: angleToCenter + k * 0.18, offset: 0 });
      }
    }

    // 2️⃣ 两侧（相对朝向 ±45°）：80%
    for (const sign of [-1, 1]) {
      if (Math.random() < PROB_SIDE) {
        const worldAngle = sign * PETAL_ANGLE_SIDE + rotationDelta;
        queue.push({ angle: worldAngle, offset: 0 });
      }
    }

    // 3️⃣ 中间层（相对朝向 ±25°）：50%
    for (const sign of [-1, 1]) {
      if (Math.random() < PROB_MID) {
        const worldAngle = sign * PETAL_ANGLE_MID + rotationDelta;
        queue.push({ angle: worldAngle, offset: 0 });
      }
    }

    // 4️⃣ 贴边子弹：90%
    if (Math.random() < PROB_EDGE) {
      const isLeft = Math.abs(bomb.targetX - BX) < 1;
      const isTop  = Math.abs(bomb.targetY - BY) < 1;
      const hAngle = isLeft ? 0 : Math.PI;
      const vAngle = isTop ? Math.PI / 2 : -Math.PI / 2;
      queue.push({ angle: hAngle, offset: 0 });
      queue.push({ angle: vAngle, offset: 0 });
    }

    // 截断到最多 9 发
    if (queue.length > MAX_BULLETS_PER_ROUND) {
      queue.length = MAX_BULLETS_PER_ROUND;
    }

    // 生成子弹
    for (const item of queue) {
      const sx = bomb.x + Math.cos(item.angle) * PETAL_DISTANCE;
      const sy = bomb.y + Math.sin(item.angle) * PETAL_DISTANCE;
      bullets.push(createBullet(sx, sy, item.angle, item.offset, BULLET_SPEED));
      spawnFireParticles(sx, sy, item.angle);
    }
  }

  // ---------- 更新 ----------
  function update() {
    if (state !== 'playing') return;

    time++; gameTime++;
    difficulty = 1 + gameTime / 1500;

    const sp = soul.speed;
    if (keys['arrowleft'] || keys['a']) soul.x -= sp;
    if (keys['arrowright'] || keys['d']) soul.x += sp;
    if (keys['arrowup'] || keys['w']) soul.y -= sp;
    if (keys['arrowdown'] || keys['s']) soul.y += sp;
    soul.x = Math.max(BX + soul.r, Math.min(BX + BW - soul.r, soul.x));
    soul.y = Math.max(BY + soul.r, Math.min(BY + BH - soul.r, soul.y));

    if (invincible > 0) invincible--;

    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnBomb();
    }

    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i];

      if (b.state === 'moving') {
        b.progress += b.speed;
        if (b.progress >= 1) {
          b.progress = 1;
          b.x = b.targetX;
          b.y = b.targetY;
          b.state = 'firing';
          b.fireTimer = 0;
          fireOneRound(b);
          b.fireRoundsLeft--;
        } else {
          b.x = b.startX + (b.targetX - b.startX) * b.progress;
          b.y = b.startY + (b.targetY - b.startY) * b.progress;
        }
      } else if (b.state === 'firing') {
        b.fireTimer++;
        if (b.fireTimer >= FIRE_INTERVAL_FRAMES) {
          b.fireTimer = 0;
          if (b.fireRoundsLeft > 0) {
            fireOneRound(b);
            b.fireRoundsLeft--;
          } else {
            b.state = 'fading';
            b.alpha = 1;
          }
        }
      } else if (b.state === 'fading') {
        b.alpha -= 0.025;
        if (b.alpha <= 0) bombs.splice(i, 1);
      }
    }

    // 子弹更新
    for (let i = bullets.length - 1; i >= 0; i--) {
      const bu = bullets[i];

      const currentOffset = bu.currentAngle - bu.baseAngle;
      if (Math.abs(currentOffset) < Math.abs(bu.targetOffset)) {
        const dir = Math.sign(bu.targetOffset);
        bu.currentAngle += dir * BULLET_TURN_SPEED;
        const newOffset = bu.currentAngle - bu.baseAngle;
        if (Math.abs(newOffset) > Math.abs(bu.targetOffset)) {
          bu.currentAngle = bu.baseAngle + bu.targetOffset;
        }
      } else {
        bu.currentAngle = bu.baseAngle + bu.targetOffset;
      }

      bu.x += Math.cos(bu.currentAngle) * bu.speed;
      bu.y += Math.sin(bu.currentAngle) * bu.speed;
      bu.life--;

      if (bu.life <= 0 || bu.x < -80 || bu.x > CW + 80 || bu.y < -80 || bu.y > CH + 80) {
        bullets.splice(i, 1);
        continue;
      }

      if (invincible <= 0) {
        const dx = bu.x - soul.x;
        const dy = bu.y - soul.y;
        const dist = Math.hypot(dx, dy);
        // ⭐ 用更大的判定半径进行碰撞检测
        if (dist < bu.r + soul.r - 2) {
          takeDamage(7);
          bullets.splice(i, 1);
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    score = Math.floor(gameTime / 10);
    if (gameTime % 1800 === 0 && hp < maxHp) {
      hp = Math.min(maxHp, hp + 5);
      updateHpUI();
    }
  }

  function takeDamage(dmg) {
    if (invincible > 0) return;
    hp -= dmg; invincible = 50; updateHpUI();

    canvas.style.transform = 'translate(3px, -2px)';
    setTimeout(() => { canvas.style.transform = ''; }, 60);
    setTimeout(() => {
      canvas.style.transform = 'translate(-3px, 2px)';
      setTimeout(() => { canvas.style.transform = ''; }, 60);
    }, 70);

    if (hp <= 0) {
      hp = 0;
      state = 'gameover';
      document.getElementById('gameover').style.display = 'block';
    }
  }

  function draw() {
    ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#111118';
    ctx.fillRect(0, 0, CW, BY); ctx.fillRect(0, BY + BH, CW, CH - BY - BH);
    ctx.fillRect(0, BY, BX, BH); ctx.fillRect(BX + BW, BY, CW - BX - BW, BH);

    ctx.strokeStyle = '#6a3d9a'; ctx.lineWidth = 3; ctx.strokeRect(BX, BY, BW, BH);
    ctx.strokeStyle = '#9b59b644'; ctx.lineWidth = 8; ctx.strokeRect(BX, BY, BW, BH);
    ctx.strokeStyle = '#6a3d9a18'; ctx.lineWidth = 1;
    for (let i = BX + 40; i < BX + BW; i += 40) {
      ctx.beginPath(); ctx.moveTo(i, BY); ctx.lineTo(i, BY + BH); ctx.stroke();
    }
    for (let j = BY + 40; j < BY + BH; j += 40) {
      ctx.beginPath(); ctx.moveTo(BX, j); ctx.lineTo(BX + BW, j); ctx.stroke();
    }

    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 炸弹
    for (const b of bombs) {
      ctx.save();
      ctx.globalAlpha = b.alpha;
      ctx.translate(b.x, b.y);
      ctx.rotate(b.currentRotation - BOMB_BASE_ORIENTATION);

      const scale = b.state === 'moving' ? 1 + Math.sin(time * 0.2) * 0.08 : 1;
      ctx.scale(scale, scale);

      if (bombImg) {
        ctx.drawImage(bombImg, -b.r, -b.r, b.r * 2, b.r * 2);
      } else {
        ctx.fillStyle = '#44cc88';
        ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '16px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('♣', 0, 1);
      }
      ctx.restore();
    }

    // 子弹
    for (const bu of bullets) {
      ctx.save();
      ctx.translate(bu.x, bu.y);
      ctx.rotate(bu.currentAngle);

      if (bulletImg) {
        const dw = bu.r * 2 * BULLET_VISUAL_SCALE;
        const dh = bu.r * 2 * BULLET_VISUAL_SCALE;
        ctx.drawImage(bulletImg, -dw / 2, -dh / 2, dw, dh);
      } else {
        ctx.fillStyle = '#44cc88';
        ctx.beginPath(); ctx.arc(0, 0, bu.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // 灵魂
    if (state === 'playing' || state === 'start') {
      const alpha = invincible > 0 && Math.floor(invincible / 4) % 2 === 0 ? 0.3 : 1;
      ctx.globalAlpha = alpha;

      ctx.save();
      ctx.translate(soul.x, soul.y);

      if (soulImg) {
        const dw = soul.r * 3.2;
        const dh = soul.r * 3.2;
        ctx.drawImage(soulImg, -dw / 2, -dh / 2, dw, dh);
      } else {
        ctx.shadowColor = '#ff3355'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff3355';
        ctx.beginPath(); const s = soul.r;
        ctx.moveTo(0, s * 0.4);
        ctx.bezierCurveTo(-s * 1.4, -s * 0.6, -s * 0.5, -s * 1.4, 0, -s * 0.5);
        ctx.bezierCurveTo(s * 0.5, -s * 1.4, s * 1.4, -s * 0.6, 0, s * 0.4);
        ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = '#ff8899';
        ctx.beginPath(); ctx.arc(-2, -3, 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = '#ffd700';
    ctx.font = '14px "Courier New", monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(`SCORE ${score}`, BX + 4, BY + 4);
    ctx.fillText(`WAVE ${Math.floor(gameTime / 600) + 1}`, BX + 4, BY + 22);

    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, CW, CH);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();

  document.getElementById('start-screen').addEventListener('click', startGame);
  document.getElementById('start-screen').addEventListener('touchstart', e => {
    e.preventDefault();
    startGame();
  }, { passive: false });

  window.addEventListener('blur', () => {
    Object.keys(keys).forEach(k => keys[k] = false);
  });

})();
</script>
</body>
</html>
